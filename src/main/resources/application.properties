# ===== Database Configuration =====
# Set to "database" for JDBC H2, or "cache" for in-memory
repository.type=database

# H2 (Development)
db.url=jdbc:h2:./data/quantity_measurement;AUTO_SERVER=TRUE;DB_CLOSE_DELAY=-1
db.username=sa
db.password=
db.driver=org.h2.Driver

# Connection Pool
db.pool.size=5
db.pool.timeout=30000

# Logging
logging.level=INFO